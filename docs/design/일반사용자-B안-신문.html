<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주택공급 신문판</title>
<meta name="description" content="경기 31개 시군에 앞으로 들어올 공공주택과 지금 신청할 수 있는 공고를 신문 1면처럼 보여 주는 시제품">
<link rel="stylesheet" href="../../assets/fonts/noto-sans-kr/noto-sans-kr.css">
<script>
  try { const t = localStorage.getItem('hb-paper-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root {
  --paper: #FFFFFF;
  --ink: #111111;
  --ink-2: #4D4D4D;
  --hair: #C9C9C9;
  --accent: #C7341C;
  --tint: #F2F2F2;
  --m0: #FFFFFF; --m1: #DEDEDE; --m2: #A6A6A6; --m3: #5E5E5E; --m4: #1C1C1C;
  --edge: #111111; --ctx: #EDEDED; --ctx-edge: #FFFFFF; --ctx-ink: #6B6B6B;
  --lab-lo: #111111; --lab-hi: #FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111111; --ink: #F2F2F2; --ink-2: #B3B3B3; --hair: #3B3B3B; --accent: #FF7357; --tint: #1F1F1F;
    --m0: #111111; --m1: #383838; --m2: #6B6B6B; --m3: #ADADAD; --m4: #F2F2F2;
    --edge: #8C8C8C; --ctx: #222222; --ctx-edge: #111111; --ctx-ink: #9A9A9A;
    --lab-lo: #F2F2F2; --lab-hi: #111111;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111111; --ink: #F2F2F2; --ink-2: #B3B3B3; --hair: #3B3B3B; --accent: #FF7357; --tint: #1F1F1F;
  --m0: #111111; --m1: #383838; --m2: #6B6B6B; --m3: #ADADAD; --m4: #F2F2F2;
  --edge: #8C8C8C; --ctx: #222222; --ctx-edge: #111111; --ctx-ink: #9A9A9A;
  --lab-lo: #F2F2F2; --lab-hi: #111111;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.6 'Noto Sans KR', sans-serif;
  font-variant-numeric: tabular-nums;
  word-break: keep-all; overflow-wrap: anywhere;
}
::selection { background: var(--accent); color: var(--paper); }
input { caret-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
h1, h2, h3, p, ol, ul, dl, dd, figure { margin: 0; padding: 0; }
ol, ul { list-style: none; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.page { max-width: 1440px; margin: 0 auto; padding: 0 24px 32px; }

/* 제호 띠 */
.mast { padding-top: 16px; border-bottom: 6px solid var(--ink); }
.mast-top { display: flex; align-items: center; gap: 24px; padding-bottom: 12px; }
.flag { display: flex; align-items: baseline; gap: 14px; font-size: 38px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; white-space: nowrap; }
.edition { font-size: 16px; font-weight: 700; letter-spacing: 0; padding-left: 14px; border-left: 1px solid var(--ink); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.dateline { display: flex; flex-wrap: wrap; align-items: center; column-gap: 6px; border-top: 1px solid var(--ink); padding: 4px 0; font-size: 14px; color: var(--ink-2); min-height: 44px; }
.dateline b { color: var(--ink); font-weight: 700; }

.search { position: relative; width: 320px; }
.search svg.i { position: absolute; left: 12px; top: 12px; color: var(--ink-2); pointer-events: none; }
.search input {
  width: 100%; height: 44px; padding: 0 12px 0 40px; border: 1px solid var(--ink); border-radius: 0;
  background: var(--paper); color: var(--ink); font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--ink-2); }
.search input::-webkit-search-cancel-button { display: none; }
.qlist { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; background: var(--paper); border: 1px solid var(--ink); border-top: 0; max-height: 360px; overflow-y: auto; }
.qlist li { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0 12px; cursor: pointer; border-top: 1px solid var(--hair); }
.qlist li:first-child { border-top: 0; }
.qlist li[aria-selected="true"], .qlist li:hover { background: var(--tint); }
.qlist li .u { font-size: 14px; color: var(--ink-2); }
.qlist li.none { cursor: default; color: var(--ink-2); }
.qlist mark { background: none; color: var(--accent); font-weight: 700; }

.btn-t { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid var(--ink); background: var(--paper); cursor: pointer; font-size: 14px; font-weight: 700; white-space: nowrap; }
.btn-t:hover { background: var(--tint); }

/* 1면 격자 */
.front { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; align-items: start; padding-top: 20px; }
.news { grid-column: 1 / 6; grid-row: 1; }
.apply { grid-column: 1 / 6; grid-row: 2; padding-top: 28px; }
.mapcol { grid-column: 6 / 11; grid-row: 1 / 3; }
.side { grid-column: 11 / 13; grid-row: 1 / 3; }
.mapcol, .side { position: relative; }
@media (min-width: 1200px) { .mapcol, .side { position: sticky; top: 12px; } }
.mapcol::before, .side::before { content: ""; position: absolute; left: -12.5px; top: 0; bottom: 0; border-left: 1px solid var(--hair); }

.hl { font-size: 64px; line-height: 1.1; font-weight: 700; letter-spacing: -0.035em; }
.hl > span { display: block; }
.hl .num { color: var(--accent); }
.lead { margin-top: 18px; font-size: 20px; line-height: 1.6; max-width: 34em; }
.facts { display: flex; flex-wrap: wrap; margin-top: 20px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--hair); }
.facts > div { display: flex; align-items: baseline; gap: 8px; padding: 10px 18px 10px 0; margin-right: 18px; border-right: 1px solid var(--hair); }
.facts > div:last-child { border-right: 0; margin-right: 0; }
.facts dt { font-size: 14px; color: var(--ink-2); }
.facts dd { font-size: 24px; font-weight: 700; line-height: 1.2; }
.facts dd small { font-size: 16px; font-weight: 400; }
.nextc { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 16px; }
.nextc dt { font-size: 14px; color: var(--ink-2); flex: none; }
.nextc dd { min-width: 0; }
.nextc b { font-weight: 700; }
.home-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.btn-home { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; background: var(--ink); color: var(--paper); font-size: 16px; font-weight: 700; cursor: pointer; }
.btn-home:hover { background: var(--accent); }
.btn-home[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.home-note { font-size: 14px; color: var(--ink-2); }
.home-note button { border: 0; background: none; padding: 0; min-height: 44px; font-size: 14px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* 단 머리 */
.sec { display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 20px; font-weight: 700; line-height: 1.3; border-bottom: 1px solid var(--ink); }
.sec .aside { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--ink-2); }
.info { display: inline-grid; place-items: center; width: 44px; height: 44px; margin: -8px -10px; border: 0; background: none; color: var(--ink-2); cursor: pointer; flex: none; }
.info:hover { color: var(--accent); }
.info svg.i { width: 18px; height: 18px; }

/* 지금 신청 */
.nt { position: relative; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; padding: 14px 40px 14px 0; border-bottom: 1px solid var(--hair); text-decoration: none; color: inherit; }
.nt:hover { background: var(--tint); }
.nt:hover .nt-title { text-decoration: underline; text-underline-offset: 3px; }
.nt-when { display: flex; flex-direction: column; padding-left: 8px; }
.nt-st { font-size: 14px; font-weight: 700; }
.nt-st.soon { color: var(--accent); }
.nt-big { font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.nt-big small { font-size: 16px; font-weight: 700; letter-spacing: 0; margin-left: 1px; }
.nt-suf { font-size: 14px; color: var(--ink-2); }
.nt-meta { font-size: 14px; color: var(--ink-2); }
.nt-title { font-size: 16px; font-weight: 700; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nt-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; min-height: 26px; padding: 0 8px; border: 1px solid var(--hair); font-size: 14px; line-height: 1.2; }
.chip.t { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.nt-price { margin-top: 6px; font-size: 14px; }
.nt-go { position: absolute; right: 8px; top: 14px; color: var(--ink-2); }
.nt:hover .nt-go { color: var(--accent); }
.near { display: flex; align-items: center; min-height: 40px; font-size: 14px; font-weight: 700; color: var(--ink-2); border-bottom: 1px solid var(--hair); }
.empty { padding: 14px 0; border-bottom: 1px solid var(--hair); font-size: 16px; }
.more { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; min-width: 44px; padding: 0; border: 0; background: none; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* 지도 */
.mapbox { position: relative; }
.mapsvg { display: block; width: 100%; height: auto; max-height: 680px; }
.bigmap { position: absolute; right: 0; top: 8px; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); }
.bigmap:hover { background: var(--ink); color: var(--paper); }
.ctx path { fill: var(--ctx); stroke: var(--ctx-edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
.faces path { stroke: var(--edge); stroke-width: 0.7; vector-effect: non-scaling-stroke; cursor: pointer; outline: none; }
.faces .m0 { fill: var(--m0); } .faces .m1 { fill: var(--m1); } .faces .m2 { fill: var(--m2); } .faces .m3 { fill: var(--m3); } .faces .m4 { fill: var(--m4); }
.faces path:hover, .faces path.on, .faces path:focus-visible { fill: color-mix(in srgb, var(--fc) 80%, var(--ink)); }
.faces .m0 { --fc: var(--m0); } .faces .m1 { --fc: var(--m1); } .faces .m2 { --fc: var(--m2); } .faces .m3 { --fc: var(--m3); } .faces .m4 { --fc: var(--m4); }
.ring { fill: none; stroke: var(--accent); stroke-width: 3; vector-effect: non-scaling-stroke; pointer-events: none; stroke-linejoin: round; }
.ring.hov { stroke-width: 2; }
.labels text { font-family: 'Noto Sans KR', sans-serif; paint-order: stroke; stroke-linejoin: round; pointer-events: none; }
.labels .lt { fill: var(--lab-lo); stroke: var(--m1); }
.labels .dk { fill: var(--lab-hi); stroke: var(--m4); }
.labels .cx { fill: var(--ctx-ink); stroke: var(--ctx); }
.labels .sel { font-weight: 700; }

/* 곁단 */
.top li button { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: baseline; gap: 6px; width: 100%; min-height: 44px; padding: 8px 4px 8px 0; border: 0; border-bottom: 1px solid var(--hair); background: none; text-align: left; cursor: pointer; }
.top li button:hover { background: var(--tint); }
.top .rk { font-size: 14px; color: var(--ink-2); text-align: right; }
.top .nm { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .v { font-size: 16px; font-weight: 700; }
.top button[aria-current="true"] .nm { color: var(--accent); font-weight: 700; }
.top li.gap { margin-top: 12px; border-top: 1px solid var(--ink); }
.legend { margin-top: 24px; }
.lg-cap { font-size: 14px; font-weight: 700; padding-bottom: 6px; }
.lg-scale { display: grid; grid-template-columns: 24px auto; column-gap: 10px; }
.lg-scale li { display: contents; }
.lg-scale i { display: block; height: 36px; border: 1px solid var(--edge); border-bottom-width: 0; }
.lg-scale li:last-child i { border-bottom-width: 1px; }
.lg-scale span { font-size: 14px; line-height: 1; align-self: start; transform: translateY(-1px); }
.lg-scale span.mid { align-self: center; transform: none; }
.lg-none { display: grid; grid-template-columns: 24px auto; column-gap: 10px; align-items: center; margin-top: 12px; font-size: 14px; }
.lg-none i { display: block; height: 24px; border: 1px solid var(--edge); }
.sw0 { background: var(--m0); } .sw1 { background: var(--m1); } .sw2 { background: var(--m2); } .sw3 { background: var(--m3); } .sw4 { background: var(--m4); }

/* 아래 단 */
.back { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; margin-top: 32px; border-top: 3px solid var(--ink); padding-top: 4px; }
.when { grid-column: 1 / 8; }
.projects { grid-column: 8 / 13; position: relative; }
.projects::before { content: ""; position: absolute; left: -12.5px; top: 0; bottom: 0; border-left: 1px solid var(--hair); }
.sec2 { display: flex; align-items: center; gap: 4px; min-height: 52px; font-size: 24px; font-weight: 700; line-height: 1.3; }
.sec2 .aside { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--ink-2); }
.years { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); border-top: 1px solid var(--ink); border-left: 1px solid var(--hair); }
.yr { position: relative; display: flex; flex-direction: column; padding: 12px 14px 22px; border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); min-height: 148px; }
.yr .y { font-size: 16px; font-weight: 700; }
.yr .n { margin-top: auto; font-size: 44px; font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; }
.yr .u { font-size: 14px; color: var(--ink-2); }
.yr .bar { position: absolute; left: 14px; bottom: 12px; height: 4px; background: var(--ink); }
.yr.max { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.yr.max .u { color: var(--paper); }
.yr.max .bar { background: var(--paper); }
.yr.unk .y { color: var(--ink-2); font-weight: 400; }
.yr.unk .bar { background: var(--ink-2); }
.yr-none { padding: 16px 0; border-top: 1px solid var(--ink); }

.ptable { width: 100%; border-collapse: collapse; table-layout: fixed; border-top: 1px solid var(--ink); }
.ptable th { white-space: nowrap; font-size: 14px; font-weight: 400; color: var(--ink-2); text-align: left; padding: 8px 0; border-bottom: 1px solid var(--hair); }
.ptable td { padding: 10px 0; border-bottom: 1px solid var(--hair); vertical-align: baseline; }
.ptable .c-n { width: auto; padding-right: 12px; }
.ptable td.c-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptable .c-u { width: 72px; text-align: right; padding-right: 16px; }
.ptable td.c-u { font-weight: 700; }
.ptable .c-s { width: 88px; }
.ptable td.c-s, .ptable td.c-y { font-size: 14px; }
.ptable .c-y { width: 64px; text-align: right; }
.ptable td.c-y.unk { color: var(--ink-2); }

.src { display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; margin-top: 32px; padding-top: 6px; border-top: 1px solid var(--ink); font-size: 14px; color: var(--ink-2); }

/* 풀이 팝오버 */
.tip { position: fixed; inset: auto; margin: 0; max-width: min(340px, calc(100vw - 32px)); padding: 12px 14px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.6; }
.tip::backdrop { background: transparent; }

/* 1024: 2단 */
@media (max-width: 1199px) {
  .news, .apply { grid-column: 1 / 7; }
  .mapcol { grid-column: 7 / 13; grid-row: 1; }
  .side { grid-column: 7 / 13; grid-row: 2; display: grid; grid-template-columns: minmax(0, 1fr) 150px; column-gap: 24px; padding-top: 28px; align-content: start; }
  .side .sec { grid-column: 1 / -1; }
  .side .legend { margin-top: 8px; }
  .side::before { top: 28px; }
  .search { width: 280px; }
}
@media (max-width: 1023px) {
  .hl { font-size: 44px; }
}
/* 390: 1단 */
@media (max-width: 767px) {
  .page { padding: 0 16px 24px; }
  .mast-top { flex-wrap: wrap; gap: 12px; }
  .flag { font-size: 30px; gap: 10px; }
  .edition { font-size: 14px; padding-left: 10px; }
  .tools { display: contents; }
  #theme { margin-left: auto; }
  .search { order: 3; width: 100%; }
  .front { display: block; padding-top: 16px; }
  .hl { font-size: 40px; }
  .lead { font-size: 18px; margin-top: 12px; }
  .facts dd { font-size: 20px; }
  .facts > div { padding-right: 12px; margin-right: 12px; }
  .mapcol, .side { margin-top: 28px; }
  .mapcol::before, .side::before, .projects::before { display: none; }
  .side { display: grid; grid-template-columns: minmax(0, 1fr) 128px; column-gap: 16px; padding-top: 0; }
  .side .sec { grid-column: 1 / -1; }
  .apply.folded .nt.extra, .apply.folded .near.extra { display: none; }
  .back { display: block; }
  .projects { margin-top: 28px; }
  .years { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .yr { min-height: 112px; padding: 10px 10px 20px; }
  .yr .n { font-size: 30px; }
  .yr .bar { left: 10px; }
  .nt { grid-template-columns: 76px minmax(0, 1fr); gap: 12px; }
  .ptable .c-u { width: 60px; padding-right: 10px; }
  .ptable .c-s { width: 72px; }
  .ptable .c-y { width: 68px; }
}
@media (prefers-reduced-motion: no-preference) {
  .faces path { transition: fill .15s ease-out; }
}
</style>
</head>
<body>
<div class="page">
  <header class="mast">
    <div class="mast-top">
      <p class="flag">주택공급<span class="edition">일반사용자판</span></p>
      <div class="tools">
        <div class="search" role="search">
          <label for="q" class="sr">시군 찾기</label>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="q" type="search" placeholder="시군 찾기 · 예: 화성, ㄴㅇㅈ" autocomplete="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-controls="qlist" aria-autocomplete="list">
          <ul id="qlist" class="qlist" role="listbox" aria-label="찾은 시군" hidden></ul>
        </div>
        <button id="theme" class="btn-t" type="button" aria-pressed="false"></button>
      </div>
    </div>
    <p class="dateline"><b id="today"></b><span aria-hidden="true">·</span><span>자료 기준 <span id="refdate"></span></span><span aria-hidden="true">·</span><span>공고 기준 <span id="noticeat"></span></span></p>
  </header>

  <main class="front">
    <section class="news" aria-labelledby="hl">
      <h1 id="hl" class="hl"></h1>
      <p id="lead" class="lead"></p>
      <dl id="facts" class="facts"></dl>
      <dl id="nextc" class="nextc"></dl>
      <div class="home-row">
        <button id="home" class="btn-home" type="button" aria-pressed="false"></button>
        <p id="home-note" class="home-note"></p>
      </div>
      <p id="live" class="sr" aria-live="polite"></p>
    </section>

    <section id="apply" class="apply folded" aria-labelledby="ap-h">
      <h2 id="ap-h" class="sec">지금 신청
        <button class="info" type="button" data-tip="apply" aria-label="지금 신청 풀이"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
      </h2>
      <div id="apply-list"></div>
      <button id="apply-more" class="more" type="button" hidden></button>
    </section>

    <section class="mapcol" aria-labelledby="map-h">
      <h2 id="map-h" class="sec">경기 31개 시군
        <button class="info" type="button" data-tip="map" aria-label="지도 풀이"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
      </h2>
      <div class="mapbox">
        <svg id="map" class="mapsvg" role="group" aria-label="경기 시군 지도. 진할수록 앞으로 들어올 집이 많아요">
          <g class="ctx"></g><g class="faces"></g>

      </div>${ICON_GO}<span class="sr">(새 창)</span></a>`;
  }

  /* 지도 그리기 */
  const svg = $('#map');
  const [vx, vy, vw, vh] = D.view;
  svg.setAttribute('viewBox', D.view.join(' '));
  const NS = 'http://www.w3.org/2000/svg';
  const gctx = svg.querySelector('.ctx'), gfaces = svg.querySelector('.faces'), glabels = svg.querySelector('.labels');
  for (const f of D.ctx) { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', f.d); gctx.appendChild(p); }
  const faceEl = {};
  for (const s of D.shapes) {
    const c = byCode[s.c];
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', s.d);
    p.setAttribute('class', `m${level(c.total)}`);
    p.setAttribute('tabindex', '0');
    p.setAttribute('role', 'button');
    p.setAttribute('aria-label', `${c.n}, 앞으로 들어올 집 ${c.total ? man(c.total) + '집' : '없음'}`);
    p.dataset.c = s.c;
    const t = document.createElementNS(NS, 'title'); t.textContent = `${c.n} ${c.total ? fmt(c.total) + '집' : '사업 없음'}`; p.appendChild(t);
    gfaces.appendChild(p);
    faceEl[s.c] = p;
  }
  const ringSel = $('#ring-sel'), ringHov = $('#ring-hov');
  gfaces.addEventListener('click', (e) => { const c = e.target.closest('path')?.dataset.c; if (c) select(c); });
  gfaces.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const c = e.target.dataset.c; if (c) { e.preventDefault(); select(c); }
  });
  gfaces.addEventListener('pointerover', (e) => { const c = e.target.closest('path')?.dataset.c; if (c && c !== sel) ringHov.setAttribute('d', shapeOf[c].d); });
  gfaces.addEventListener('pointerleave', () => ringHov.setAttribute('d', ''));
  gfaces.addEventListener('focusin', (e) => { const c = e.target.dataset.c; if (c && c !== sel) ringHov.setAttribute('d', shapeOf[c].d); });
  gfaces.addEventListener('focusout', () => ringHov.setAttribute('d', ''));

  function drawLabels() {
    glabels.textContent = '';
    const w = svg.getBoundingClientRect().width;
    if (!w) return;
    const k = vw / w;              /* 화면 1px 의 지도 단위 */
    const fs = 14 * k, gap = 3 * k;
    const want = [];
    if (sel) want.push({ c: sel, sel: true });
    for (const c of ranked.slice(0, 5)) if (c.c !== sel) want.push({ c: c.c });
    const placed = [];
    const hit = (b) => placed.some((q) => b.x < q.x + q.width + gap && q.x < b.x + b.width + gap && b.y < q.y + q.height + gap && q.y < b.y + b.height + gap);
    const put = (x, y, text, cls) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', x); t.setAttribute('y', y);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'central');
      t.setAttribute('font-size', fs); t.setAttribute('stroke-width', 3 * k);
      t.setAttribute('class', cls); t.textContent = text;
      glabels.appendChild(t);
      const b = t.getBBox();
      if (hit(b)) { t.remove(); return false; }
      placed.push(b); return true;
    };
    for (const it of want) {
      const s = shapeOf[it.c], c = byCode[it.c];
      const tone = level(c.total) >= 3 ? 'dk' : 'lt';
      put(s.lx, s.ly, c.n, `${tone}${it.sel ? ' sel' : ''}`);
    }
    for (const l of D.ctxLabels) put(l.x, l.y, l.n, 'cx');
  }

  /* 고르기 */
  let sel = null;
  let home = store.get('hb-paper-home');
  if (home && !byCode[home]) home = null;

  function countUp(el, to) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.textContent = man(to);   /* 그림이 멈춘 창(백그라운드)에서도 최종값이 남도록 먼저 쓴다 */
    if (reduce || to < 50) return;
    const t0 = performance.now(), dur = 520;
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(2, -10 * p);
      el.textContent = man(Math.round(to * (p >= 1 ? 1 : e)));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function renderNews(c) {
    const hl = $('#hl');
    if (c.total) {
      hl.innerHTML = `<span>${esc(c.n)}에</span><span><span class="num" id="hlnum"></span>집이</span><span>들어옵니다</span>`;
      countUp($('#hlnum'), c.total);
      const yrs = Object.entries(c.years).filter(([y]) => y !== '미정').sort((a, b) => b[1] - a[1]);
      const count = c.p.length;
      let lead = `공공주택 사업 ${count}곳의 집을 모두 더한 수예요.`;
      if (yrs.length) lead += ` ${yrs[0][0]}년에 가장 많은 ${fmt(yrs[0][1])}집이 들어와요.`;
      else lead += ' 들어올 해가 정해진 사업은 아직 없어요.';
      $('#lead').textContent = lead;
      $('#facts').innerHTML = [['준비 중', c.cnt.prep], ['짓는 중', c.cnt.build], ['모집 끝남', c.cnt.done]]
        .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}<small>곳</small></dd></div>`).join('');
      $('#facts').hidden = false;
      $('#nextc').innerHTML = c.next
        ? `<dt>다음 준공</dt><dd><b>${ymd(c.next.cd)}</b> · ${esc(c.next.n)} ${fmt(c.next.u)}집</dd>`
        : `<dt>다음 준공</dt><dd>날짜가 정해진 사업이 없어요</dd>`;
    } else {
      hl.innerHTML = `<span>${esc(c.n)}에는</span><span>아직 예정된</span><span>공공주택이 없어요</span>`;
      $('#lead').textContent = '계획부터 모집까지 진행 중인 사업이 아직 없어요. 지도에서 가까운 시군을 눌러 보세요.';
      $('#facts').hidden = true;
      $('#nextc').innerHTML = '';
    }
    const hb = $('#home');
    const isHome = home === c.c;
    hb.setAttribute('aria-pressed', String(isHome));
    hb.innerHTML = isHome ? `${ICON_CHECK}내 동네` : `${ICON_PIN}내 동네로 정하기`;
    $('#home-note').innerHTML = home && !isHome ? `내 동네 <button type="button" id="go-home">${esc(byCode[home].n)}</button>` : '';
  }

  function renderApply(c) {
    const list = applyFor(c);
    const box = $('#apply-list');
    let html = '', nearShown = false, i = 0;
    if (!list.some((x) => !x.near)) html += `<p class="empty">${esc(c.n)}${josa(c.n, '은', '는')} 지금 접수 중인 공고가 없어요</p>`;
    for (const item of list) {
      const extra = i > 0;
      if (item.near && !nearShown) { html += `<p class="near${extra ? ' extra' : ''}">근처에서</p>`; nearShown = true; }
      html += noticeCard(item, extra);
      i++;
    }
    box.innerHTML = html;
    const more = $('#apply-more');
    more.hidden = list.length <= 1;
    $('#apply').classList.add('folded');
    more.textContent = `${list.length - 1}건 더`;
    more.onclick = () => { $('#apply').classList.remove('folded'); more.hidden = true; };
    /* 넓은 화면은 모두 보이므로 '더' 단추는 휴대폰에서만 */
    more.style.display = matchMedia('(max-width: 767px)').matches ? '' : 'none';
  }

  function renderTop(c) {
    const rows = ranked.slice(0, 5);
    const extra = c.rank && c.rank > 5 ? c : null;
    const li = (x, gap) => `<li${gap ? ' class="gap"' : ''}><button type="button" data-c="${x.c}"${x.c === c.c ? ' aria-current="true"' : ''}>
      <span class="rk">${x.rank}</span><span class="nm">${esc(x.n)}</span><span class="v">${fmt(x.total)}</span></button></li>`;
    $('#top').innerHTML = rows.map((x) => li(x)).join('') + (extra ? li(extra, true) : '');
  }

  function renderYears(c) {
    const ent = Object.entries(c.years).sort((a, b) => (a[0] === '미정') - (b[0] === '미정') || a[0].localeCompare(b[0]));
    const box = $('#years');
    if (!ent.length) { box.innerHTML = `<li class="yr-none">들어올 집이 없어요</li>`; $('#when-aside').textContent = ''; return; }
    const maxv = Math.max(...ent.map((e) => e[1]));
    const known = ent.filter((e) => e[0] !== '미정');
    const top = known.length ? known.reduce((a, b) => (b[1] > a[1] ? b : a))[0] : null;
    box.innerHTML = ent.map(([y, v]) => `<li class="yr${y === top ? ' max' : ''}${y === '미정' ? ' unk' : ''}">
      <span class="y">${y === '미정' ? '연도 미정' : y + '년'}</span><b class="n">${fmt(v)}</b><span class="u">집</span>
      <i class="bar" style="width:calc((100% - 28px) * ${(v / maxv).toFixed(3)})" aria-hidden="true"></i></li>`).join('');
    $('#when-aside').textContent = `모두 ${fmt(c.total)}집`;
  }

  let showAll = false;
  function renderProjects(c) {
    const N = 8;
    const rows = showAll ? c.p : c.p.slice(0, N);
    $('#pbody').innerHTML = rows.length ? rows.map((p) => `<tr><td class="c-n" title="${esc(p.n)}">${esc(p.n)}</td><td class="c-u">${fmt(p.u)}</td><td class="c-s">${STATUS[p.s]}</td><td class="c-y${p.y ? '' : ' unk'}">${p.y || '미정'}</td></tr>`).join('')
      : `<tr><td colspan="4">사업이 없어요</td></tr>`;
    $('#pj-aside').textContent = c.p.length ? `${c.p.length}곳 · 집 많은 순` : '';
    const more = $('#pmore');
    more.hidden = c.p.length <= N;
    more.textContent = showAll ? '접기' : `${c.p.length - N}곳 더 보기`;
  }
  $('#pmore').addEventListener('click', () => { showAll = !showAll; renderProjects(byCode[sel]); });

  function select(code, opts = {}) {
    if (!byCode[code]) return;
    const c = byCode[code];
    if (sel && faceEl[sel]) faceEl[sel].classList.remove('on');
    sel = code;
    showAll = false;
    faceEl[code].classList.add('on');
    ringSel.setAttribute('d', shapeOf[code].d);
    ringHov.setAttribute('d', '');
    renderNews(c); renderApply(c); renderTop(c); renderYears(c); renderProjects(c);
    const big = $('#bigmap');
    big.href = `/map?sgg=${code}`;
    big.setAttribute('aria-label', `${c.n} 큰 지도에서 보기`);
    big.title = `${c.n} 큰 지도에서 보기`;
    drawLabels();
    if (location.hash !== '#' + code) history.replaceState(null, '', '#' + code);
    if (!opts.quiet) $('#live').textContent = `${c.n}${josa(c.n, '을', '를')} 골랐어요. 앞으로 ${c.total ? man(c.total) + '집이 들어와요' : '들어올 집이 없어요'}.`;
  }

  $('#top').addEventListener('click', (e) => { const b = e.target.closest('button[data-c]'); if (b) select(b.dataset.c); });
  $('#home').addEventListener('click', () => {
    home = home === sel ? null : sel;
    store.set('hb-paper-home', home);
    renderNews(byCode[sel]);
  });
  document.addEventListener('click', (e) => { if (e.target.id === 'go-home' && home) select(home); });
  window.addEventListener('hashchange', () => { const c = location.hash.slice(1); if (byCode[c] && c !== sel) select(c); });
  let rz; window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { drawLabels(); if (sel) renderApply(byCode[sel]); }); });

  /* 검색: 부분 일치 + 초성 + 치는 중인 글자 */
  const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
  const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
  const syl = (ch) => { const n = ch.charCodeAt(0) - 0xAC00; return n >= 0 && n < 11172 ? n : -1; };
  const jamo = (s) => [...s].map((ch) => { const n = syl(ch); return n < 0 ? ch : CHO[Math.floor(n / 588)] + JUNG[Math.floor((n % 588) / 28)] + JONG[n % 28]; }).join('');
  const initials = (s) => [...s].map((ch) => { const n = syl(ch); return n < 0 ? ch : CHO[Math.floor(n / 588)]; }).join('');
  const index = cities.map((c) => ({ c, j: jamo(c.n), i: initials(c.n) }));
  function find(q) {
    q = q.replace(/\s+/g, '');
    if (!q) return [];
    const onlyCho = [...q].every((ch) => CHO.includes(ch));
    const out = [];
    for (const x of index) {
      let at = -1, len = 0;
      if (onlyCho) { at = x.i.indexOf(q); len = q.length; }
      else if ((at = x.c.n.indexOf(q)) >= 0) len = q.length;
      else {
        const jq = jamo(q), p = x.j.indexOf(jq);
        if (p >= 0) { /* 자모 위치 → 글자 위치 */ let k = 0, acc = 0; while (k < x.c.n.length && acc + jamo(x.c.n[k]).length <= p) { acc += jamo(x.c.n[k]).length; k++; } at = k; len = Math.max(1, [...q].length); }
      }
      if (at >= 0) out.push({ c: x.c, at, len, score: (at === 0 ? 0 : 1) + (onlyCho ? 0.5 : 0) });
    }
    return out.sort((a, b) => a.score - b.score || b.c.total - a.c.total).slice(0, 8);
  }
  const qi = $('#q'), ql = $('#qlist');
  let hits = [], active = -1;
  function showList() {
    const q = qi.value.trim();
    hits = find(q); active = hits.length ? 0 : -1;
    if (!q) { ql.hidden = true; qi.setAttribute('aria-expanded', 'false'); return; }
    ql.innerHTML = hits.length ? hits.map((h, i) => {
      const n = h.c.n, a = Math.min(h.at, n.length), b = Math.min(n.length, a + h.len);
      return `<li role="option" id="qo-${i}" data-c="${h.c.c}" aria-selected="${i === active}">
        <span>${esc(n.slice(0, a))}<mark>${esc(n.slice(a, b))}</mark>${esc(n.slice(b))}</span><span class="u">${h.c.total ? fmt(h.c.total) + '집' : '사업 없음'}</span></li>`;
    }).join('') : '<li class="none" role="option" aria-disabled="true">맞는 경기 시군이 없어요</li>';
    ql.hidden = false; qi.setAttribute('aria-expanded', 'true');
    qi.setAttribute('aria-activedescendant', active >= 0 ? `qo-${active}` : '');
  }
  function pick(code) { qi.value = ''; ql.hidden = true; qi.setAttribute('aria-expanded', 'false'); select(code); }
  qi.addEventListener('input', showList);
  qi.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!hits.length) return; e.preventDefault();
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
      ql.querySelectorAll('li').forEach((li, i) => li.setAttribute('aria-selected', String(i === active)));
      qi.setAttribute('aria-activedescendant', `qo-${active}`);
    } else if (e.key === 'Enter') { if (hits[active]) { e.preventDefault(); pick(hits[active].c.c); } }
    else if (e.key === 'Escape') { ql.hidden = true; qi.setAttribute('aria-expanded', 'false'); }
  });
  ql.addEventListener('mousedown', (e) => { const li = e.target.closest('li[data-c]'); if (li) { e.preventDefault(); pick(li.dataset.c); } });
  qi.addEventListener('blur', () => setTimeout(() => { ql.hidden = true; qi.setAttribute('aria-expanded', 'false'); }, 120));

  /* 야간판 */
  const themeBtn = $('#theme');
  const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
  const MOON = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg>';
  const SUN = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>';
  function paintTheme() { const d = isDark(); themeBtn.setAttribute('aria-pressed', String(d)); themeBtn.innerHTML = d ? `${SUN}주간판` : `${MOON}야간판`; }
  themeBtn.addEventListener('click', () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('hb-paper-theme', t); paintTheme(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);
  paintTheme();

  /* 풀이 팝오버 */
  const TIPS = {
    apply: `고른 시군의 마감 전 공고를 접수 중(마감 가까운 순) → 접수 예정(시작 가까운 순)으로 보여 줘요. 3건이 안 되면 약 33km 안의 시군 공고, 그다음 시군이 정해지지 않은 경기 전역 공고로 채워요. 출처: ${esc(D.noticeSource)} · ${D.noticesAt.replace('T', ' ')} 받음.`,
    map: '공공주택 사업 가운데 계획이 정해진 뒤부터 모집이 끝난 사업까지(입주 전)의 집 수를 시군마다 더했어요. 구가 있는 시는 시 하나로 묶었어요. 면을 누르면 그 시군 소식으로 바뀌어요.',
    when: '입주 예정 해로 나눴어요. 입주 예정이 없으면 준공 예정 해, 둘 다 없으면 연도 미정이에요. 가장 많은 해는 검게 칠했어요.',
    src: `사업 자료 ${D.ref} 기준(국토교통부 공공주택 사업 자료, 건축HUB 인허가·착공, LH 공급계획). 공고 ${D.noticesAt.replace('T', ' ')} 기준(${esc(D.noticeSource)}). 시제품이라 실제 신청은 공고 원문에서 하세요.`,
  };
  const tip = $('#tip');
  let tipFor = null;
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.info'); if (!b) return;
    if (tipFor === b && tip.matches(':popover-open')) { tip.hidePopover(); return; }
    tip.innerHTML = TIPS[b.dataset.tip] || '';
    tipFor = b;
    tip.showPopover();
    const r = b.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = Math.min(window.innerWidth - tw - 16, Math.max(16, r.left + r.width / 2 - tw / 2));
    let y = r.bottom + 4; if (y + th > window.innerHeight - 8) y = Math.max(8, r.top - th - 4);
    tip.style.left = `${x}px`; tip.style.top = `${y}px`;
  });
  tip.addEventListener('toggle', (e) => { if (e.newState === 'closed') tipFor = null; });

  /* 머리 줄 */
  const W = ['일', '월', '화', '수', '목', '금', '토'];
  $('#today').textContent = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일 ${W[today.getDay()]}요일`;
  $('#refdate').textContent = D.ref.replace(/-/g, '.');
  const na = D.noticesAt.split('T');
  $('#noticeat').textContent = `${na[0].replace(/-/g, '.')} ${na[1]}`;

  const start = location.hash.slice(1);
  select(byCode[start] ? start : home || '41360', { quiet: true });
  if (document.fonts) document.fonts.ready.then(drawLabels);
})();
</script>
</body>
</html>
