/* ── 브라우저 기본 표면 ── */

/* ── 상단 메뉴(운영 TopNav 와 같은 64px) ── */

.tip { position: absolute; z-index: 3; pointer-events: none; min-width: 176px; padding: 9px 11px; border-radius: 10px; border: 1px solid rgb(157 188 233 / 45%); background: rgb(10 16 48 / 90%); backdrop-filter: blur(6px); color: #E8EDFF; box-shadow: var(--shadow-pop); font-size: 13px; line-height: 1.55; }

.tip .badge { background: #E8EDFF; color: #0A1030; } .tip .badge.plan { background: #9DBCE9; color: #10243D; }

/* ── 선택 시점 패널 ── */
#p-snap .ph h2 { font-size: 26px; cursor: help; }

.stbl .hd { font-size: 13px; color: var(--muted-foreground); padding-bottom: 4px; }

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * p) return m * p; return 10 * p; }

  MO.months.forEach((m, i) => { if (m.endsWith('-01')) s += `<line x1="${(PL + st * i).toFixed(1)}" x2="${(PL + st * i).toFixed(1)}" y1="${PT + PH}" y2="${PT + PH + 5}" stroke="var(--mute)"/><text x="${x(i).toFixed(1)}" y="${H - 8}" fill="var(--mute)" font-size="13" text-anchor="middle">${m.slice(0, 4)}</text>`; });
