* { box-sizing:border-box; }
body { margin:0; }
main { max-width:1440px; margin:auto; padding:36px 48px 32px; }
header { display:flex; align-items:center; justify-content:space-between; gap:24px; padding-bottom:26px; }

a { color:inherit; text-underline-offset:4px; font-size:12px; }
a:focus-visible,button:focus-visible { outline:2px solid var(--clay); outline-offset:5px; }
.hero { position:relative; display:grid; place-items:center; min-height:350px; padding:80px 64px; background:#fff; border:1px solid #E3E4E5; }
.lockup { display:block; width:min(100%,660px); height:auto; overflow:visible; }
.caption { position:absolute; top:22px; left:24px; font-size:11px; letter-spacing:.1em; color:#7B8088; }
.edition { position:absolute; right:24px; bottom:20px; font-size:11px; color:#7B8088; }
.variants { display:grid; grid-template-columns:1fr 1fr; gap:1px; margin-top:1px; background:#E3E4E5; border:1px solid #E3E4E5; }
.variant { position:relative; display:grid; place-items:center; padding:64px 36px; min-height:230px; background:#F9F8F5; }
.variant .lockup { max-width:380px; }
.dark { background:#132543; --ink:#F8F7F3; --clay:#ED9275; }
.dark .caption { color:#BAC4D1; }
.sizes { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:32px; padding:30px 24px; background:white; border:1px solid #E3E4E5; border-top:0; }
.size { display:flex; align-items:center; gap:24px; }
.size-label { color:#767D87; font-size:11px; white-space:nowrap; }
.actual .lockup { width:125px; }
.compact .lockup { width:100px; }
.icon { width:28px; height:28px; display:block; }
footer { display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; padding-top:18px; font-size:12px; line-height:1.6; color:#626974; }
footer p { margin:0; }
button { border:0; border-bottom:1px solid #A5AAB1; padding:0 0 2px; background:none; color:var(--ink); font:inherit; cursor:pointer; }
body.mono { --clay:var(--ink); }
body.mono .dark { --clay:var(--ink); }
@media(min-width:1700px) { main { padding-top:48px; } .hero { min-height:400px; } }
@media(max-width:640px) { main { padding:24px 16px; } header { align-items:flex-start; } .hero { min-height:260px; padding:64px 24px; } .variants { grid-template-columns:1fr; } .variant { min-height:200px; padding:58px 28px; } .sizes { gap:26px; padding:26px 20px; } .size { gap:20px; } .caption { left:20px; top:18px; } footer { gap:12px; } }
@media print { :root { background:white; } main { padding:0; } header a,footer button { display:none; } * { print-color-adjust:exact; } }
