# 사업 원장 월 수집 — 2026-10-14 예약 실행 제거(데이터 안정화 전까지 수동 실행만, docs/product/데이터-정제-계획.md 6절). 새 건축HUB 대용량 판(데이터 월 D 판은 D+1 월 20일께 나온다)으로 원장을 다시 만들어 PR 을 연다.
#   tools/ledger/monthly.js: 판 받기 → hub-bulk → snapshot(API) → 공고 수집 → convert → validate → (새 달이면 trend --close) → trend → board
#   새 자료가 없으면 아무것도 바꾸지 않고 끝난다(여러 번 돌려도 안전). 같은 브랜치(ledger/<달>-<판>)가 이미 있으면 건너뛴다.
# Supabase 원장에는 쓰지 않는다(begin_run 같은 DB 쓰기 없음). git 이 무시하는 원본(과거 판 zip)만 Storage ledger-raw 에 받고(pull) 올린다(push).
# 적재는 사람이 PR 을 확인하고 main 에 합친 뒤 ledger-load.yml 이 한다.
# 비밀값(이름만): NEXT_PUBLIC_SUPABASE_URL · SUPABASE_SECRET_KEY · DATA_GO_KR_KEY. 하나라도 없으면 '비밀값 없음 — 건너뜀'으로 성공 종료한다.
# 공개 저장소: set -x 를 쓰지 않고 비밀값을 출력하지 않는다(도구의 오류 문장도 키·연결 문자열을 싣지 않는다).
# 저장소 설정 'Allow GitHub Actions to create and approve pull requests' 가 켜져 있어야 PR 을 만들 수 있다.
name: ledger-collect

on:
  workflow_dispatch:
    inputs:
      month:
        description: '원장 달 YYYY-MM (비우면 한국시간 이번 달)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ledger-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      MONTH_INPUT: ${{ github.event.inputs.month }}
    steps:
      - name: 비밀값 확인
        id: secrets
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$DATA_GO_KR_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "비밀값 없음 — 건너뜀"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: 의존성
        if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      - name: 계획(--dry-run, 판 목록만 본다)
        id: plan
        if: steps.secrets.outputs.ok == 'true'
        run: |
          args=()
          if [ -n "$MONTH_INPUT" ]; then args=(--month "$MONTH_INPUT"); fi
          node tools/ledger/monthly.js "${args[@]}" --dry-run --result "$RUNNER_TEMP/plan.json"
          status=$(node -p "require(process.env.RUNNER_TEMP + '/plan.json').status")
          branch=$(node -p "require(process.env.RUNNER_TEMP + '/plan.json').branch")
          if [ "$status" = planned ] && git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "브랜치 $branch 가 이미 있다(PR 확인 대기) — 건너뜀"
            status=exists
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: 과거 판 원본 받기(Storage → raw/hub-bulk-history)
        if: steps.plan.outputs.status == 'planned'
        run: node tools/ledger/raw-store.js pull

      - name: 원장 월 갱신
        id: run
        if: steps.plan.outputs.status == 'planned'
        run: |
          args=()
          if [ -n "$MONTH_INPUT" ]; then args=(--month "$MONTH_INPUT"); fi
          node tools/ledger/monthly.js "${args[@]}" --result "$RUNNER_TEMP/result.json" --summary "$RUNNER_TEMP/summary.md"
          for k in status month edition branch; do
            echo "$k=$(node -p "require(process.env.RUNNER_TEMP + '/result.json').$k")" >> "$GITHUB_OUTPUT"
          done

      - name: git 이 무시하는 새 원본 올리기(Storage ledger-raw/<달>/)
        if: steps.run.outputs.status == 'updated'
        env:
          MONTH: ${{ steps.run.outputs.month }}
        run: node tools/ledger/raw-store.js push --month "$MONTH"

      - name: 브랜치·PR
        if: steps.run.outputs.status == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.run.outputs.month }}
          EDITION: ${{ steps.run.outputs.edition }}
          BRANCH: ${{ steps.run.outputs.branch }}
        run: |
          if [ -z "$(git status --porcelain -- "schemas/ledger-$MONTH" data/board)" ]; then
            echo "바뀐 파일 없음 — PR 을 만들지 않는다"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "브랜치 $BRANCH 가 이미 있다 — 건너뜀"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A -- "schemas/ledger-$MONTH" data/board
          git commit -q -m "chore(ledger): 사업 원장 $MONTH 월 갱신 — 건축HUB 대용량 $EDITION 판"
          git push -q origin "$BRANCH"
          { cat "$RUNNER_TEMP/summary.md"; echo; echo '🤖 Generated with [Claude Code](https://claude.com/claude-code)'; } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$BRANCH" --title "사업 원장 $MONTH 월 갱신(건축HUB 대용량 $EDITION 판)" --body-file "$RUNNER_TEMP/body.md"
