# 사업 원장 열린 달 주 1회 갱신(월요일 한국시간 06:00) — 건축HUB 대용량 판(월 1회) 사이의 착공·사용검사·예정일 변화를 주택인허가 기본개요 OpenAPI 현재값으로 덮어쓴다.
#   tools/ledger/monthly.js --refresh: 기준일 = 오늘 → hub-bulk → hub-api-refresh(법정동 약 1,600곳) → snapshot → 공고 수집 → convert → validate → trend → board
#   가장 늦은 원장 폴더가 한국시간 이번 달이 아니면(새 달 폴더는 ledger-collect 가 21일부터 만든다) 'skipped' 로 끝난다.
#   결과 unchanged → 끝. auto → github-actions 봇으로 main 에 커밋·푸시하고 ledger-load 를 직접 건다. review(판정 등급이 바뀐 사업 > max(50, 2%) 또는 사업 수 ±2% 초과) → 브랜치 PR.
#   안전장치(법정동 호출 실패 > 5%, 관리번호 일치율 < 90%)에 걸리면 hub-api-refresh 가 실패하고 아무것도 커밋하지 않는다.
# 커밋 범위: schemas/ledger-<달>(git 이 무시하는 raw/hub-refresh 원본 제외 — 표를 저장소 입력으로 다시 만들 수 있게 공고 원본·스냅샷·후보 id 매핑도 함께)와 보드·지도·판정 이력.
# git 이 무시하는 API 원본(raw/hub-refresh)은 Storage ledger-raw/<달>/hub-refresh/ 에 올린다(raw-store.js push --only). DB 에는 쓰지 않는다(적재는 ledger-load).
# 비밀값(이름만): NEXT_PUBLIC_SUPABASE_URL · SUPABASE_SECRET_KEY · DATA_GO_KR_KEY. 하나라도 없으면 '비밀값 없음 — 건너뜀'으로 성공 종료한다.
# 공개 저장소: set -x 를 쓰지 않고 비밀값을 출력하지 않는다. main 보호 규칙이 봇 푸시를 막으면 auto 도 PR 로 바꿔야 한다.
name: ledger-refresh

on:
  schedule:
    # 주 1회 월요일 한국시간 06:00(= UTC 일요일 21:00)
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ledger-collect
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
    steps:
      - name: 비밀값 확인
        id: secrets
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$DATA_GO_KR_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "비밀값 없음 — 건너뜀"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: 의존성
        if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      - name: 과거 판 원본 받기(Storage → raw/hub-bulk-history, trend 가 읽는다)
        if: steps.secrets.outputs.ok == 'true'
        run: node tools/ledger/raw-store.js pull

      - name: 열린 달 갱신
        id: run
        if: steps.secrets.outputs.ok == 'true'
        run: |
          node tools/ledger/monthly.js --refresh --result "$RUNNER_TEMP/result.json" --summary "$RUNNER_TEMP/summary.md"
          for k in status month branch; do
            echo "$k=$(node -p "require(process.env.RUNNER_TEMP + '/result.json').$k")" >> "$GITHUB_OUTPUT"
          done

      - name: git 이 무시하는 API 원본 올리기(Storage ledger-raw/<달>/hub-refresh/)
        if: steps.run.outputs.status == 'auto' || steps.run.outputs.status == 'review'
        env:
          MONTH: ${{ steps.run.outputs.month }}
        run: node tools/ledger/raw-store.js push --month "$MONTH" --only raw/hub-refresh

      - name: main 에 커밋·적재 걸기(auto)
        if: steps.run.outputs.status == 'auto'
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.run.outputs.month }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "schemas/ledger-$MONTH" data/board/ledger-board.json data/board/ledger-map.json data/board/judgment-history.json
          if git diff --cached --quiet; then echo "바뀐 파일 없음 — 끝"; exit 0; fi
          git commit -q -m "chore(ledger): 사업 원장 $MONTH 열린 달 갱신 — 건축HUB OpenAPI $(TZ=Asia/Seoul date +%F)"
          git push -q origin HEAD:main
          # GITHUB_TOKEN 으로 한 push 는 다른 워크플로(ledger-load 의 on: push)를 깨우지 않는다 → 적재를 직접 건다
          gh workflow run ledger-load.yml --ref main

      - name: 브랜치·PR(review)
        if: steps.run.outputs.status == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.run.outputs.month }}
          BRANCH: ${{ steps.run.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "브랜치 $BRANCH 가 이미 있다 — 건너뜀"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A -- "schemas/ledger-$MONTH" data/board/ledger-board.json data/board/ledger-map.json data/board/judgment-history.json
          git commit -q -m "chore(ledger): 사업 원장 $MONTH 열린 달 갱신(검토) — 건축HUB OpenAPI"
          git push -q origin "$BRANCH"
          { cat "$RUNNER_TEMP/summary.md"; echo; echo '🤖 Generated with [Claude Code](https://claude.com/claude-code)'; } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$BRANCH" --title "사업 원장 $MONTH 열린 달 갱신(검토 필요)" --body-file "$RUNNER_TEMP/body.md"
