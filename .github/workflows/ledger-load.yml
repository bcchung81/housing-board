# 사업 원장 적재 — main 에 원장 표·보드·지도 색인·판정 이력·화면 파일(국토부·LH·데이터 원본·사업 레지스트리)이 바뀌어 들어오면 보드의 observedMonth 달을 Supabase 에 싣고 확인한 뒤 화면 캐시를 비운다.
#   tools/ledger/supabase-load.js(begin_run → 스테이징 → publish_run → publish_map → publish_screens 한 트랜잭션, Storage 원본) → supabase-verify.js → 캐시 비우기
# 주의: 새 달을 begin_run 하면 앞 달이 닫히고 되돌릴 수 없다. 새 달 원장은 ledger-collect.yml 이 PR 로만 올리므로,
#       앞 달이 닫히는 일은 사람이 그 PR 을 main 에 합칠 때만 일어난다. 열린 달 재적재(같은 달)는 몇 번이고 허용된다.
# git 이 무시하는 과거 판 zip 은 체크아웃에 없어 이 잡이 다시 올리지 않는다(ledger-collect 가 이미 올렸다, ingest_runs.files 에도 빠진다).
# 비밀값(이름만): SUPABASE_DB_URL · SUPABASE_SECRET_KEY · NEXT_PUBLIC_SUPABASE_URL · NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
#   선택 BOARD_REVALIDATE_URL · REVALIDATE_SECRET. 필수 넷 중 하나라도 없으면 '비밀값 없음 — 건너뜀'으로 성공 종료한다.
# 열린 달 주 1회 갱신(ledger-refresh.yml)이 GITHUB_TOKEN 으로 main 에 푸시하면 on: push 가 깨지 않으므로 그 잡이 gh workflow run 으로 이 잡을 건다(workflow_dispatch).
# 공개 저장소: set -x 를 쓰지 않는다. supabase-load.js 는 오류 문장의 연결 문자열·비밀번호·호스트를 *** 로 가린다.
name: ledger-load

on:
  push:
    branches: [main]
    paths:
      - 'schemas/ledger-*/tables/**'
      - 'data/board/ledger-board.json'
      - 'data/board/ledger-map.json'
      - 'data/board/judgment-history.json'
      - 'data/board/molit.json'
      - 'data/board/lh-completion.json'
      - 'data/board/sources.json'
      - 'registry/projects.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: 비밀값 확인
        id: secrets
        run: |
          if [ -n "$SUPABASE_DB_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "비밀값 없음 — 건너뜀"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.secrets.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: 의존성
        if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      - name: 적재할 달(보드의 observedMonth)
        id: month
        if: steps.secrets.outputs.ok == 'true'
        run: |
          month=$(node -p "require('./data/board/ledger-board.json').observedMonth")
          if ! printf '%s' "$month" | grep -Eq '^[0-9]{4}-(0[1-9]|1[0-2])$'; then echo "observedMonth 가 YYYY-MM 이 아니다"; exit 1; fi
          echo "month=$month" >> "$GITHUB_OUTPUT"

      - name: 적재(supabase-load.js)
        if: steps.secrets.outputs.ok == 'true'
        env:
          MONTH: ${{ steps.month.outputs.month }}
        run: node tools/ledger/supabase-load.js --month "$MONTH"

      - name: 확인(supabase-verify.js)
        if: steps.secrets.outputs.ok == 'true'
        env:
          MONTH: ${{ steps.month.outputs.month }}
        run: node tools/ledger/supabase-verify.js --month "$MONTH"

      - name: 화면 캐시 비우기
        if: steps.secrets.outputs.ok == 'true'
        env:
          BOARD_REVALIDATE_URL: ${{ secrets.BOARD_REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$BOARD_REVALIDATE_URL" ]; then echo "BOARD_REVALIDATE_URL 비밀값 없음 — 건너뜀"; exit 0; fi
          node -e "const L = require('./tools/ledger/supabase-load'); L.revalidateBoard(L.readEnv(), console.log)"
